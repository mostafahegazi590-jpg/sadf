<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت عد تنازلي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .timer-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .number {
            font-size: 64px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="timer-box">
    <h2>الرجاء الانتظار...</h2>
    <div class="number" id="countdown">120</div>
    <p id="status">جاري العد التنازلي...</p>
</div>

<script>
    let timeLeft = 120;
    const countdownElement = document.getElementById('countdown');
    const statusElement = document.getElementById('status');

    const timer = setInterval(() => {
        timeLeft--;
        countdownElement.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            statusElement.textContent = "انتهى الوقت!";
        }
    }, 1000);
</script>

</body>
</html>
